<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anointed Studio V3 - Any Story</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#050510;color:#fff;font-family:system-ui}
.goldbg{background:linear-gradient(90deg,#FFD700,#FFA500)}
.card{background:#151528;border:1px solid #2a2a5a}
canvas{width:100%;aspect-ratio:9/16;background:#000;border-radius:18px}
</style>
</head>
<body class="p-3">
<div class="max-w-md mx-auto">
<h2 class="text-center font-bold text-xl">Anointed V3 - Any Story Real</h2>
<p class="text-center text-[11px] text-gray-400">Type ANY Bible story - Ruth, Isaac, Esther, David - it will create</p>

<textarea id="inputStory" class="w-full card rounded-xl p-3 mt-4 h-28 text-sm" placeholder="Type ANY story here... e.g. Story of Ruth and Naomi, loyalty, Boaz, kinsman redeemer... OR Story of Isaac and Abimelech... OR Story of Esther"></textarea>

<div class="grid grid-cols-3 gap-2 mt-2">
<button onclick="setStory('Story of Ruth, Moab, Naomi, Boaz, loyalty and redemption')" class="card rounded-full py-2 text-[11px]">Ruth</button>
<button onclick="setStory('Story of Isaac and Abimelech, wells, covenant, Genesis 26')" class="card rounded-full py-2 text-[11px]">Isaac</button>
<button onclick="setStory('Story of Esther, Mordecai, Haman, fasting, saves Jews')" class="card rounded-full py-2 text-[11px]">Esther</button>
<button onclick="setStory('Story of David and Goliath, 1 Samuel 17')" class="card rounded-full py-2 text-[11px]">David</button>
<button onclick="setStory('Story of Joseph in Egypt, betrayed by brothers, dreams')" class="card rounded-full py-2 text-[11px]">Joseph</button>
<button onclick="setStory('Story of Saul to Paul road to Damascus Acts 9')" class="card rounded-full py-2 text-[11px] bg-yellow-500/20">Saul</button>
</div>

<button onclick="generateAnyStory()" class="w-full goldbg text-black font-bold py-3 rounded-full mt-4">✨ Generate ANY Story Video (Dynamic)</button>

<div id="playerWrap" class="hidden mt-4">
<canvas id="c" width="720" height="1280"></canvas>
<div class="flex gap-2 mt-3">
<button onclick="playReal()" class="flex-1 goldbg text-black font-bold py-3 rounded-full">▶️ Play Real Motion</button>
<button onclick="record()" class="flex-1 card py-3 rounded-full">🔴 Record</button>
</div>
<p id="stat" class="text-center text-xs text-yellow-400 mt-2"></p>
</div>

<div id="out" class="card rounded-xl p-3 mt-4 hidden text-[11px] space-y-2"></div>
</div>

<script>
let scenes=[]; let images=[];
function setStory(t){document.getElementById('inputStory').value=t}

async function generateAnyStory(){
 const userStory=document.getElementById('inputStory').value.trim();
 if(!userStory){alert('Type a story sir e.g. Story of Ruth');return}
 document.getElementById('stat').innerText='AI writing 6 scenes for: '+userStory+'...';
 document.getElementById('playerWrap').classList.remove('hidden');

 // Call free AI to break story into 6 scenes
 try{
  const prompt=`You are Bible story director. User story: "${userStory}". Break into exactly 6 short scenes, each 1 sentence max 20 words, emotional, like viral Bible commentary. Alternate presenter and bible scenes. Return JSON array: [{"type":"presenter","text":"...","imgPrompt":"presenter black woman in studio"},{"type":"bible","text":"...","imgPrompt":"..."}]. Make imgPrompt detailed cinematic 9:16 biblical. Return ONLY JSON.`;
  const res=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'user',content:prompt}],jsonMode:true})});
  const data=await res.json();
  let txt=data.choices?.[0]?.message?.content||'';
  // extract JSON array
  let jsonStr=txt.match(/\[[\s\S]*\]/)?.[0]||'[]';
  scenes=JSON.parse(jsonStr);
  if(scenes.length===0) throw 'no scenes';
 }catch(e){
  // fallback dynamic based on user story
  scenes=[
   {type:'presenter',text:`Today we dive into ${userStory}. A story that will touch your soul.`,imgPrompt:'black woman teacher in studio soft light'},
   {type:'bible',text:`${userStory} begins with a divine setup you cannot ignore.`,imgPrompt:`${userStory}, biblical cinematic epic, 9:16`},
   {type:'bible',text:`In the middle of trial, God was working behind the scenes for redemption.`,imgPrompt:`${userStory} emotional moment, biblical robe, dramatic light, 9:16`},
   {type:'presenter',text:`But look what God did next. This is where your story connects.`,imgPrompt:'black woman explaining bible with compassion'},
   {type:'bible',text:`God turned pain into purpose, shame into glory. This is His pattern.`,imgPrompt:`${userStory} glorious victory, heavenly light, 9:16`},
   {type:'presenter',text:`If God did it for them, He can do it for you. Type Amen and share.`,imgPrompt:'black woman praying eyes closed studio'}
  ];
 }

 // build image URLs dynamically
 images=[];
 scenes.forEach(s=>{
  if(s.type==='presenter'){
   images.push('https://images.unsplash.com/photo-1531123897727-8f129e1688ce?w=720&h=1280&fit=crop'); // female presenter placeholder
  } else {
   const p=encodeURIComponent(s.imgPrompt+', biblical, cinematic, ultra detailed, 9:16, no text');
   images.push(`https://image.pollinations.ai/prompt/${p}?width=720&height=1280&nologo=true&seed=${Math.floor(Math.random()*9999)}`);
  }
 });

 let out=document.getElementById('out'); out.classList.remove('hidden'); out.innerHTML='';
 scenes.forEach((s,i)=>{out.innerHTML+=`<div><b>Scene ${i+1} [${s.type}]</b>: ${s.text}<br><span class="text-[9px] text-yellow-500">Prompt: ${s.imgPrompt}</span></div>`});
 document.getElementById('stat').innerText=`✅ 6 NEW scenes for "${userStory}" ready - Tap Play Real Motion`;
 drawScene(0,0);
}

let animId; let zoom=1;
function drawScene(idx, progress){
 const canvas=document.getElementById('c'); const ctx=canvas.getContext('2d');
 const img=new Image(); img.crossOrigin='anonymous';
 img.src=images[idx];
 img.onload=()=>{
  ctx.clearRect(0,0,720,1280);
  // Ken Burns zoom for real motion
  let z=1+ progress*0.15;
  let w=720*z, h=1280*z;
  ctx.drawImage(img,(720-w)/2,(1280-h)/2,w,h);
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(0,880,720,400);
  ctx.fillStyle='#fff'; ctx.font='bold 28px sans-serif';
  let words=scenes[idx].text.match(/.{1,36}/g)||[];
  words.slice(0,4).forEach((ln,j)=>ctx.fillText(ln,24,940+j*36));
  ctx.fillStyle='#FFD700'; ctx.font='12px sans-serif'; ctx.fillText(`Scene ${idx+1}/6 • ${scenes[idx].type} • Like her video - Real Motion`,24,900);
 }
}

async function playReal(){
 if(scenes.length===0) return;
 let idx=0;
 async function nextScene(){
  if(idx>=scenes.length){document.getElementById('stat').innerText='Finished - Now Record MP4';return}
  document.getElementById('stat').innerText=`Playing ${idx+1}/6: ${scenes[idx].text.slice(0,40)}...`;
  // animate zoom over 5 sec
  let start=Date.now(); let dur=5000;
  function animate(){
   let p=(Date.now()-start)/dur; if(p>1) p=1;
   drawScene(idx,p);
   if(p<1){ requestAnimationFrame(animate); }
  }
  animate();
  // speak
  await speakText(scenes[idx].text);
  idx++; setTimeout(nextScene,400);
 }
 nextScene();
}

function speakText(t){
 return new Promise(res=>{
  let u=new SpeechSynthesisUtterance(t); u.rate=0.92;
  let voices=speechSynthesis.getVoices();
  let female=voices.find(v=>v.name.toLowerCase().includes('female')||v.name.includes('Google US English'))||voices[0];
  if(female) u.voice=female;
  u.onend=()=>res();
  speechSynthesis.speak(u);
 });
}

let rec, chunks=[];
function record(){
 const canvas=document.getElementById('c');
 const stream=canvas.captureStream(30);
 rec=new MediaRecorder(stream,{mimeType:'video/webm'}); chunks=[];
 rec.ondataavailable=e=>chunks.push(e.data);
 rec.onstop=()=>{
  let blob=new Blob(chunks,{type:'video/webm'});
  let url=URL.createObjectURL(blob);
  let a=document.createElement('a'); a.href=url; a.download='anointed-'+Date.now()+'.webm'; a.click();
  document.getElementById('stat').innerText='✅ Video saved! Open CapCut to make MP4 like her';
 };
 rec.start(); playReal();
 setTimeout(()=>rec.state!=='inactive'&&rec.stop(),32000);
 document.getElementById('stat').innerText='🔴 Recording 32s with Real Motion...';
}
</script>
</body>
</html>
